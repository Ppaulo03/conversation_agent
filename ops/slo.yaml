# Service level objectives of the runtime, as data. Each entry is an alert that fires when its
# objective is VIOLATED. Generate the alert rules and the dashboard with
#   uv run python -m conversation_agent.app.ops render
# and keep them in sync with `... ops check` (CI). Every `runbook` is a section of
# docs/OPERATIONS.md that says what to do.
slos:
  - name: InboxLatencyHigh
    description: Inbound messages wait more than 60 s for a turn (workers are behind).
    expr: conversation_agent_inbox_oldest_ready_age_seconds > 60
    for: 5m
    severity: warning
    runbook: inbox-latency
    unit: s

  - name: InboxLatencyCritical
    description: Inbound messages wait more than 5 min for a turn.
    expr: conversation_agent_inbox_oldest_ready_age_seconds > 300
    for: 5m
    severity: critical
    runbook: inbox-latency
    unit: s

  - name: TurnStuck
    description: A turn has been open for more than 5 min (a worker is stuck or died holding it).
    expr: conversation_agent_turns_oldest_processing_age_seconds > 300
    for: 5m
    severity: critical
    runbook: stuck-turn
    unit: s

  - name: OutboxDelay
    description: A reply has waited more than 2 min to be sent.
    expr: conversation_agent_outbox_oldest_pending_age_seconds > 120
    for: 5m
    severity: warning
    runbook: outbox-delay
    unit: s

  - name: DeliveryUnsettled
    description: A reply has been unconfirmed for more than 1 h, approaching the gateway's idempotency window.
    expr: conversation_agent_outbox_oldest_unsettled_age_seconds > 3600
    for: 5m
    severity: critical
    runbook: unsettled-delivery
    unit: s

  - name: UnknownWriteStale
    description: An external write has had an unknown outcome for more than 15 min.
    expr: conversation_agent_invocations_oldest_unresolved_age_seconds > 900
    for: 10m
    severity: critical
    runbook: unknown-write
    unit: s

  - name: HumanHandoffBacklog
    description: A conversation has waited more than 10 min for a person to take it.
    expr: conversation_agent_handoffs_oldest_pending_age_seconds > 600
    for: 5m
    severity: warning
    runbook: handoff-backlog
    unit: s

  - name: TimersOverdue
    description: Timers (proactive messages, reconciliation) are more than 2 min overdue.
    expr: conversation_agent_scheduled_oldest_overdue_age_seconds > 120
    for: 5m
    severity: warning
    runbook: overdue-timers
    unit: s

  - name: CircuitOpened
    description: A circuit breaker for an external system opened in the last 10 min.
    expr: increase(conversation_agent_circuit_transitions_total{state="open"}[10m]) > 0
    for: 1m
    severity: warning
    runbook: circuit-open

  - name: ToolFailureRateHigh
    description: More than 20 % of outbound tool calls fail for a provider over 10 min.
    expr: >-
      sum by (provider) (rate(conversation_agent_tool_calls_total{status!~"success|business_error|validation_error"}[10m]))
      / sum by (provider) (rate(conversation_agent_tool_calls_total[10m])) > 0.2
    for: 10m
    severity: warning
    runbook: tool-failures

  - name: LLMErrorRateHigh
    description: More than 10 % of LLM calls fail for a provider over 10 min.
    expr: >-
      sum by (provider) (rate(conversation_agent_llm_calls_total{outcome="error"}[10m]))
      / sum by (provider) (rate(conversation_agent_llm_calls_total[10m])) > 0.1
    for: 10m
    severity: critical
    runbook: llm-errors

  - name: LLMLatencyP95High
    description: The p95 latency of LLM calls is above 20 s for a provider.
    expr: >-
      histogram_quantile(0.95, sum by (provider, le) (rate(conversation_agent_llm_call_duration_seconds_bucket[10m]))) > 20
    for: 10m
    severity: warning
    runbook: llm-latency
    unit: s

  - name: LLMCostBurnHigh
    description: Estimated LLM spend is above the hourly ceiling (tune the number to your budget).
    expr: sum(increase(conversation_agent_llm_cost_usd_total[1h])) > 50
    for: 5m
    severity: warning
    runbook: llm-cost
    unit: currencyUSD

  - name: LLMUnpricedModel
    description: "LLM calls are being made to a model that has no price, so cost reports are incomplete."
    expr: sum(increase(conversation_agent_llm_unpriced_calls_total[30m])) > 0
    for: 5m
    severity: warning
    runbook: llm-unpriced

  - name: LLMUsageNotRecorded
    description: "LLM usage records could not be written, so the books are missing calls."
    expr: increase(conversation_agent_llm_usage_write_failures_total[10m]) > 0
    for: 1m
    severity: critical
    runbook: llm-usage-records

  - name: TurnLatencyP95High
    description: "The p95 time to process a turn is above 30 s for an agent version."
    expr: >-
      histogram_quantile(0.95, sum by (agent_id, agent_version, le) (rate(conversation_agent_turn_processing_seconds_bucket[10m]))) > 30
    for: 10m
    severity: warning
    runbook: turn-latency
    unit: s

  - name: TurnQueueWaitHigh
    description: "The p95 wait before a message is picked up is above 60 s (workers cannot keep up)."
    expr: >-
      histogram_quantile(0.95, sum by (agent_id, le) (rate(conversation_agent_turn_queue_wait_seconds_bucket[10m]))) > 60
    for: 10m
    severity: warning
    runbook: inbox-latency
    unit: s

  - name: TurnFailureRateHigh
    description: "More than 5 % of turns fail permanently for an agent version."
    expr: >-
      sum by (agent_id, agent_version) (rate(conversation_agent_turns_total{outcome="failed"}[15m]))
      / sum by (agent_id, agent_version) (rate(conversation_agent_turns_total[15m])) > 0.05
    for: 10m
    severity: critical
    runbook: turn-failures

  - name: HandoffRateHigh
    description: "More than 30 % of turns of an agent version hand the conversation to a person."
    expr: >-
      sum by (agent_id, agent_version) (rate(conversation_agent_handoffs_total[30m]))
      / sum by (agent_id, agent_version) (rate(conversation_agent_turns_total{outcome="completed"}[30m])) > 0.3
    for: 30m
    severity: warning
    runbook: handoff-rate

  - name: LLMBudgetNearLimit
    description: "A tenant has used more than 80 % of an LLM budget."
    expr: max by (tenant_id, period, unit) (conversation_agent_llm_budget_used_ratio) > 0.8
    for: 5m
    severity: warning
    runbook: llm-budget

  - name: LLMBudgetExceeded
    description: "A tenant has exhausted an LLM budget."
    expr: max by (tenant_id, period, unit) (conversation_agent_llm_budget_used_ratio) >= 1
    for: 1m
    severity: critical
    runbook: llm-budget
