# GENERATED from ops/slo.yaml by `python -m conversation_agent.app.ops render`.
groups:
- name: conversation_agent.slo
  rules:
  - alert: ConversationAgentInboxLatencyHigh
    expr: conversation_agent_inbox_oldest_ready_age_seconds > 60
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Inbound messages wait more than 60 s for a turn (workers are behind).
      runbook: docs/OPERATIONS.md#inbox-latency
  - alert: ConversationAgentInboxLatencyCritical
    expr: conversation_agent_inbox_oldest_ready_age_seconds > 300
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Inbound messages wait more than 5 min for a turn.
      runbook: docs/OPERATIONS.md#inbox-latency
  - alert: ConversationAgentTurnStuck
    expr: conversation_agent_turns_oldest_processing_age_seconds > 300
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: A turn has been open for more than 5 min (a worker is stuck or died holding it).
      runbook: docs/OPERATIONS.md#stuck-turn
  - alert: ConversationAgentOutboxDelay
    expr: conversation_agent_outbox_oldest_pending_age_seconds > 120
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: A reply has waited more than 2 min to be sent.
      runbook: docs/OPERATIONS.md#outbox-delay
  - alert: ConversationAgentDeliveryUnsettled
    expr: conversation_agent_outbox_oldest_unsettled_age_seconds > 3600
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: A reply has been unconfirmed for more than 1 h, approaching the gateway's idempotency window.
      runbook: docs/OPERATIONS.md#unsettled-delivery
  - alert: ConversationAgentUnknownWriteStale
    expr: conversation_agent_invocations_oldest_unresolved_age_seconds > 900
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: An external write has had an unknown outcome for more than 15 min.
      runbook: docs/OPERATIONS.md#unknown-write
  - alert: ConversationAgentHumanHandoffBacklog
    expr: conversation_agent_handoffs_oldest_pending_age_seconds > 600
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: A conversation has waited more than 10 min for a person to take it.
      runbook: docs/OPERATIONS.md#handoff-backlog
  - alert: ConversationAgentTimersOverdue
    expr: conversation_agent_scheduled_oldest_overdue_age_seconds > 120
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Timers (proactive messages, reconciliation) are more than 2 min overdue.
      runbook: docs/OPERATIONS.md#overdue-timers
  - alert: ConversationAgentCircuitOpened
    expr: increase(conversation_agent_circuit_transitions_total{state="open"}[10m]) > 0
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: A circuit breaker for an external system opened in the last 10 min.
      runbook: docs/OPERATIONS.md#circuit-open
  - alert: ConversationAgentToolFailureRateHigh
    expr: sum by (provider) (rate(conversation_agent_tool_calls_total{status!~"success|business_error|validation_error"}[10m]))
      / sum by (provider) (rate(conversation_agent_tool_calls_total[10m])) > 0.2
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: More than 20 % of outbound tool calls fail for a provider over 10 min.
      runbook: docs/OPERATIONS.md#tool-failures
  - alert: ConversationAgentLLMErrorRateHigh
    expr: sum by (provider) (rate(conversation_agent_llm_calls_total{outcome="error"}[10m])) / sum by
      (provider) (rate(conversation_agent_llm_calls_total[10m])) > 0.1
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: More than 10 % of LLM calls fail for a provider over 10 min.
      runbook: docs/OPERATIONS.md#llm-errors
  - alert: ConversationAgentLLMLatencyP95High
    expr: histogram_quantile(0.95, sum by (provider, le) (rate(conversation_agent_llm_call_duration_seconds_bucket[10m])))
      > 20
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: The p95 latency of LLM calls is above 20 s for a provider.
      runbook: docs/OPERATIONS.md#llm-latency
  - alert: ConversationAgentLLMCostBurnHigh
    expr: sum(increase(conversation_agent_llm_cost_usd_total[1h])) > 50
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Estimated LLM spend is above the hourly ceiling (tune the number to your budget).
      runbook: docs/OPERATIONS.md#llm-cost
  - alert: ConversationAgentLLMUnpricedModel
    expr: sum(increase(conversation_agent_llm_unpriced_calls_total[30m])) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: LLM calls are being made to a model that has no price, so cost reports are incomplete.
      runbook: docs/OPERATIONS.md#llm-unpriced
  - alert: ConversationAgentLLMUsageNotRecorded
    expr: increase(conversation_agent_llm_usage_write_failures_total[10m]) > 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: LLM usage records could not be written, so the books are missing calls.
      runbook: docs/OPERATIONS.md#llm-usage-records
  - alert: ConversationAgentTurnLatencyP95High
    expr: histogram_quantile(0.95, sum by (agent_id, agent_version, le) (rate(conversation_agent_turn_processing_seconds_bucket[10m])))
      > 30
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: The p95 time to process a turn is above 30 s for an agent version.
      runbook: docs/OPERATIONS.md#turn-latency
  - alert: ConversationAgentTurnQueueWaitHigh
    expr: histogram_quantile(0.95, sum by (agent_id, le) (rate(conversation_agent_turn_queue_wait_seconds_bucket[10m])))
      > 60
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: The p95 wait before a message is picked up is above 60 s (workers cannot keep up).
      runbook: docs/OPERATIONS.md#inbox-latency
  - alert: ConversationAgentTurnFailureRateHigh
    expr: sum by (agent_id, agent_version) (rate(conversation_agent_turns_total{outcome="failed"}[15m]))
      / sum by (agent_id, agent_version) (rate(conversation_agent_turns_total[15m])) > 0.05
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: More than 5 % of turns fail permanently for an agent version.
      runbook: docs/OPERATIONS.md#turn-failures
  - alert: ConversationAgentHandoffRateHigh
    expr: sum by (agent_id, agent_version) (rate(conversation_agent_handoffs_total[30m])) / sum by (agent_id,
      agent_version) (rate(conversation_agent_turns_total{outcome="completed"}[30m])) > 0.3
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: More than 30 % of turns of an agent version hand the conversation to a person.
      runbook: docs/OPERATIONS.md#handoff-rate
