# A customer-support agent: FAQ answers and support tickets. The SECOND domain (Phase 9).
#
# Everything here is data. Nothing about FAQ or tickets exists in core/engine: the agent is
# capabilities + a Flow + bindings over an MCP server (the tools below are what `import_mcp_tools`
# produces from that server with the allowlist in `allowlist.yaml`; a test keeps them in sync).
schema_version: 1
min_framework: "0.1.0"
agent_id: support-demo
version: "0.1.0"
timezone: America/Sao_Paulo
fallback_reply: "Desculpe, não consegui concluir agora. Pode tentar novamente?"

persona: |
  Você é a assistente virtual de suporte de uma empresa. Responda sempre em português do Brasil, de forma curta, cordial e objetiva.

  Como trabalhar:
  1. Para dúvidas, consulte a base de perguntas frequentes SOMENTE com a ferramenta de busca e responda com o que ela devolver. Nunca invente políticas, preços ou horários.
  2. Se a busca não trouxer nada útil, diga isso com honestidade e ofereça abrir um chamado.
  3. Para abrir um chamado o cliente informa o assunto e a prioridade; isso é conduzido pelo sistema. Um chamado só existe depois da confirmação do cliente.
  4. Se uma ferramenta falhar, avise que não conseguiu agora; nunca finja que deu certo.

allowed_capabilities: [support.search_faq, support.open_ticket]

# Asking for a person is decided by rules (short messages, never negated): the conversation goes to
# a human and the bot goes quiet until one returns it.
human_request:
  triggers:
    - falar com atendente
    - falar com um atendente
    - falar com uma pessoa
    - falar com um humano
    - quero um humano
    - quero uma pessoa
    - atendente humano
  reply: "Claro, vou chamar um atendente para falar com você. Em instantes alguém continua por aqui."

confirmation:
  prompt: "Posso confirmar? {summary}. Responda SIM para confirmar ou NÃO para cancelar."
  reprompt: "Não entendi. {summary}. Responda SIM para confirmar ou NÃO para cancelar."
  reprompt_unproven: 'Não consegui confirmar que o seu "sim" responde à minha pergunta. {summary}. Responda SIM ou NÃO respondendo diretamente à mensagem acima.'
  rejected: "Tudo bem, não abri o chamado."
  expired: "Esse pedido expirou. Me diga de novo o que você precisa."
  gave_up: "Não consegui uma confirmação clara, então não abri o chamado."
  executed_fallback: "Seu chamado foi registrado (situação: {status})."

capabilities:
  - name: support.search_faq
    description: >-
      Searches the company's frequently asked questions. This is the ONLY source of policies,
      prices and hours; never invent them.
    risk: read
    input:
      question:
        type: string
        min_length: 1
        max_length: 200
        description: The customer's question, in a few words
    output:
      answers:
        type: list
        items:
          type: object
          fields:
            text: {type: string}

  - name: support.open_ticket
    description: Opens a support ticket for the current customer.
    risk: write
    confirmation_required: true
    summary_template: "Abrir chamado: {subject} (prioridade {priority})"
    input:
      subject: {type: string, min_length: 3, max_length: 120, description: What the problem is}
      priority: {type: enum, values: [low, normal, high]}
    output:
      ticket_id: {type: string}

tools:
  - name: mcp_search_faq
    description: Search the FAQ.
    risk: read
    timeout_seconds: 5.0
    provider: mcp
    connection: support_mcp
    mcp:
      remote_name: search_faq
      schema_digest: e4442757d7efa88f07eb68da46709dbdc02602b0e3555701bffee5b0770e8fa5
    input:
      query: {type: string, min_length: 1, max_length: 200}
      limit: {type: integer, ge: 1, le: 20, required: false, default: 5}
    output:
      results:
        type: list
        items:
          type: object
          fields:
            answer: {type: string}

  - name: mcp_create_ticket
    description: Open a support ticket.
    risk: write
    confirmation_required: true
    timeout_seconds: 5.0
    provider: mcp
    connection: support_mcp
    mcp:
      remote_name: create_ticket
      schema_digest: 9b7576979a67149b84a931ae04d0839b591045e165ad9677424398c944c228fc
    idempotency_supported: true
    retry:
      max_attempts: 2
      mode: same_idempotency_key
    recovery:
      strategy: retry_same_key
    input:
      subject: {type: string, min_length: 3, max_length: 120}
      priority: {type: enum, values: [low, normal, high]}
    output:
      ticket_id: {type: string}
      subject: {type: string}
      priority: {type: string}

bindings:
  - capability: support.search_faq
    tool: mcp_search_faq
    input_map:
      query: $.question
    output_map:
      answers:
        from_each: $.results[*]
        map: {text: $.answer}
    error_map:
      default_5xx:
        read: {type: technical_error, retryable: true}
      timeout:
        read: {type: timeout, retryable: true}

  - capability: support.open_ticket
    tool: mcp_create_ticket
    input_map:
      subject: $.subject
      priority: $.priority
    output_map:
      ticket_id: $.ticket_id
    error_map:
      default_5xx:
        write: {type: unknown}
      timeout:
        write: {type: unknown}

flows:
  - name: ticket
    description: Open a support ticket.
    triggers:
      - abrir chamado
      - abrir um chamado
      - abrir ticket
      - abrir um ticket
      - registrar um problema
      - quero reclamar
    cancelled_reply: "Tudo bem, não vou abrir nenhum chamado."
    digression_capabilities: [support.search_faq]
    slots:
      - name: subject
        type: text
        question_check: model  # a question here is routed (FAQ), not taken as the subject
        prompt: "Qual é o assunto do chamado? Descreva o problema em uma frase."
      - name: priority
        type: enum
        prompt: "Qual a prioridade: baixa, normal ou alta?"
        choices:
          low: [baixa, sem pressa, tranquilo]
          normal: [normal, media]
          high: [alta, urgente, urgencia]
    steps:
      - kind: collect
        id: need
        slots: [subject, priority]
      - kind: propose
        id: open
        capability: support.open_ticket
        intro: "Certo, vou registrar o chamado."
        inputs:
          subject: {kind: slot, name: subject}
          priority: {kind: slot, name: priority}
        on:
          validation_error: {kind: ask, slot: subject, text: "Não consegui usar esse assunto."}
          policy_denied: {kind: say, text: "Não posso abrir chamados neste atendimento.", end: true}
        default:
          kind: handoff
          text: "Não consegui abrir o chamado agora. Vou chamar um atendente para te ajudar."
