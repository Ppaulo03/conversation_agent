# Local development services. Credentials are dev-only defaults; override via .env (never commit it).
services:
  postgres:
    image: postgres:16-alpine
    container_name: conversation_agent_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conversation_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conversation_agent_dev}
      POSTGRES_DB: ${POSTGRES_DB:-conversation_agent}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
